    <path d="M742 282 L282 476 L462 548 L534 728 Z" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M742 282 L462 548"/>
  </g>
  <!-- PDF badge -->
  <g transform="translate(600 610)">
    <rect width="190" height="230" rx="28" fill="#ffffff"/>
    <path d="M130 0 L190 60 L130 60 Z" fill="#cfe3ff"/>
    <rect x="34" y="104" width="122" height="20" rx="10" fill="#0a6cff"/>
    <rect x="34" y="144" width="96" height="20" rx="10" fill="#9cc6ff"/>
    <rect x="34" y="184" width="110" height="20" rx="10" fill="#9cc6ff"/>

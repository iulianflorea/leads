# Packaging configuration. Build with: npm run dist:mac | dist:win | dist:linux
appId: com.leadmailer.app
productName: LeadMailer
copyright: Copyright © 2026 LeadMailer
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# better-sqlite3 v13 ships N-API prebuilds for every platform (ABI-stable across Node and
# Electron), so no per-platform rebuild is needed; this also allows cross-building.
# Native .node files must live outside the asar archive to be loadable.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/*.node'
npmRebuild: false
publish: null

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.business
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Without a Developer ID certificate the app is ad-hoc signed (see README).
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  icon: build/icon.png
  maintainer: LeadMailer <support@leadmailer.local>
  synopsis: Emailuri personalizate către leaduri, cu PDF-ul potrivit atașat.
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
